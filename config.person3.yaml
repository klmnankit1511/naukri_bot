searches:
  - keywords: "Software Engineer Python"
    location: "Bengaluru"
  - keywords: "Python Developer"
    location: "Bengaluru"
  - keywords: "Machine Learning Engineer Python"
    location: "Bengaluru"
  - keywords: "AI Engineer"
    location: "Bengaluru"
  - keywords: "Software Engineer"
    location: "Any"
  - keywords: "Python Developer"
    location: "Any"

include_keywords:
  - python
  - embedded
  - fastapi
  - machine learning
  - pytorch
  - artificial intelligence

exclude_keywords:
  - senior
  - intern
  - internship
  - trainee
  - fresher
  - data analyst
  - business analyst
  - data annotation
  - content
  - sales
  - marketing
  - support engineer
  - technical support
  - frontend
  - react
  - node.js
  - java developer
  - odoo
  - erp implementation

max_jobs_per_run: 30
search_load_timeout_seconds: 60
search_load_retries: 2
post_apply_timeout_seconds: 30
post_apply_success_wait_seconds: 5
between_jobs_delay_seconds: 8
headless: false
slow_mo_ms: 250
browser_channel: chrome
profile_dir: data/person3/browser/profile
history_file: data/person3/history/applied_jobs.json
answers_file: data/person3/answers/answers.json
debug_url_log: data/person3/debug/opened_urls.jsonl
openai_model: gpt-4o-mini
resume_summary: >-
  Seema Horo is a Software Engineer at Tata Advanced Systems since July 2025,
  developing safety-critical embedded software in Python and C++ for avionics
  subsystems. She implements Linux user-space modules, IOCTL APIs, multithreaded
  communication layers, UART, GPIO and Timer drivers, and RTOS modules for
  MALE-class UAV systems. She uses perf, valgrind and gprof for system profiling,
  and JTAG and logic analyzers for hardware debugging. She creates UML diagrams,
  maintains requirement traceability under DO-178C and DO-254 processes, and
  supports SIL/HIL validation for deterministic real-time execution. She was an
  Assistant System Engineer at Tata Consultancy Services from November 2021 to
  September 2022, where she resolved more than 300 technical issues using backend
  debugging, log analysis and workflow optimization, and worked with APIs, SQL
  automation and system communication modules. She earned an M.Tech in Artificial
  Intelligence from IIT Patna in 2025 and a B.Tech in Computer Science from
  Ramgarh Engineering College in 2021. Her skills include Python, C++, SQL, Flask,
  FastAPI, SQLAlchemy, Pydantic, PyTorch, CNNs, GDB, AWS, Git, CMake, GoogleTest,
  Elasticsearch, OOP, design patterns, UML and requirement traceability. Her
  projects include multimodal early disease detection and blockchain-security
  anomaly detection with LangChain, LlamaIndex, Transformers, RAG and vector
  embeddings. Do not infer salary, notice period, availability, relocation
  preference, work authorization, or facts not stated here.

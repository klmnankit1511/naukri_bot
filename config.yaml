resume_summary: >-
  Amisha Soni is a Bangalore-based Software Engineer with approximately
  3 years of professional backend development experience. She has been
  working at Tata Consultancy Services (TCS) as a Software Engineer for
  the AVIVA client since October 2023. Her primary expertise is Java,
  Spring Boot, Spring MVC, Spring Data JPA, Hibernate, REST APIs,
  PostgreSQL, MySQL, Docker, Maven, Git, and backend application
  development. She has developed and maintained backend services for
  life and annuity insurance products, designed RESTful APIs, optimized
  JPA and SQL queries, resolved N+1 query issues, and improved premium
  calculation performance by 10%. She also has experience with Docker,
  Docker Compose, exception handling, input validation, DTO-based
  architecture, logging, monitoring, and root cause analysis.
  Her education is a B.Tech in Computer Science and Engineering.

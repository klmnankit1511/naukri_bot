searches:
  - keywords: "AI ML Engineer Python"
    location: "Bengaluru"
  - keywords: "Python Backend Developer"
    location: "Bengaluru"
  - keywords: "Senior Backend Developer"
    location: "Bengaluru"
  - keywords: "AI ML Engineer Python"
    location: "Remote"
  - keywords: "Python Backend Developer"
    location: "Remote"
  - keywords: "Senior Backend Developer"
    location: "Remote"


# The listing must mention at least one of these resume-aligned terms.
include_keywords:
  - generative ai
  - gen ai
  - genai
  - ai engineer
  - agentic ai
  - llm
  - large language model
  - rag
  - langchain
  - langgraph
  - crewai
  - crew ai
  - azure ai foundry
  - azure openai
  - machine learning
  - artificial intelligence
  - python
  - fastapi
  - backend

# Avoid roles that do not fit the resume or expected experience level.
exclude_keywords:
  - internship
  - fresher
  - unpaid
  - data entry
  - data annotation
  - sales
  - business development
  - frontend only
  - php developer
  - android developer
  - ios developer
  - 8+ years
  - 10+ years
  - 12+ years
  - internship
  - intern
  - fresher
  - data analyst
  - data entry
  - sales
  - business development
  - content writer
  - frontend only
  - php developer
  - android developer
  - ios developer
  - manual tester
  - customer support

# Global limit across all searches in one run.
max_jobs_per_run: 30
# Naukri can render skeleton placeholders for a long time on slow connections.
search_load_timeout_seconds: 60
search_load_retries: 2
# Maximum wait after Apply and after every questionnaire Save click.
post_apply_timeout_seconds: 30
post_apply_success_wait_seconds: 3
between_jobs_delay_seconds: 2
minimum_keyword_match_ratio: 0.5
company_application_limits:
  Infosys: 3
external_tab_wait_seconds: 2
headless: false
slow_mo_ms: 300
# Use the normal installed Chrome instead of Playwright's bundled Chromium.
browser_channel: chrome
profile_dir: data/browser/profile
history_file: data/history/applied_jobs.json
answers_file: data/answers/answers.json

# Optional. Set OPENAI_API_KEY in your shell; never put the key in this file.
openai_model: gpt-4o-mini
resume_summary: >-
  Ankit Kumar is a Bengaluru-based Python and GenAI Engineer with 4+ years of
  experience building enterprise backend services and AI applications. He has
  worked at Ascendion as Senior Software Engineer in Generative AI Engineering
  since April 2025, at Mobile Programming as Software Engineer from September
  2024 to April 2025, and at Techolution as Python Developer from May 2022 to
  September 2024. His explicit skills include Python, SQL, JavaScript, JSON,
  XML, FastAPI, Flask, Node.js, Express.js, REST APIs, AsyncIO, Pydantic,
  SQLAlchemy, WebSockets, microservices, Generative AI, agentic AI, LangChain,
  Azure OpenAI, Azure AI Search, Azure AI Foundry, RAG, tool calling, prompt
  engineering, DeepEval, Langfuse, AWS ECS, S3, Docker, CI/CD, Git, Azure
  DevOps, SQL Server, PostgreSQL, MySQL, MongoDB, Redis, and RabbitMQ. His
  explicit domain experience includes healthcare claims, appointment
  scheduling, healthcare contact-center workflows, procurement automation, and
  music-content metadata ingestion. He holds a B.Tech in Computer Science and
  Engineering from Ramgarh Engineering College, completed June 2022, with a
  CGPA of 8.0/10. He has built healthcare AI and multi-agent systems using
  Azure OpenAI and LangChain, production monitoring with Langfuse, and Python
  and FastAPI backend services.

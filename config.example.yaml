# Copy this file to config.yaml and edit it.
searches:
  - keywords: "python developer"
    location: "Bengaluru"
  - keywords: "backend engineer"
    location: "Remote"

# A job must contain at least one include keyword (when the list is non-empty)
# and must contain none of the exclude keywords.
include_keywords:
  - python
  - django
  - fastapi
exclude_keywords:
  - senior
  - lead
  - manager

max_jobs_per_run: 10
search_load_timeout_seconds: 60
search_load_retries: 2
post_apply_timeout_seconds: 30
headless: false
slow_mo_ms: 250
browser_channel: chrome
profile_dir: data/browser/profile
history_file: data/history/applied_jobs.json
answers_file: data/answers/answers.json
openai_model: gpt-4o-mini
resume_summary: "Paste a concise, factual resume summary here."

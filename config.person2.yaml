# Configuration for Amisha Soni.
env_file: .env.person2
searches:
  - keywords: "Java Developer"
    location: "Bengaluru"
  - keywords: "Spring Boot Developer"
    location: "Bengaluru"
  - keywords: "Java Backend Developer"
    location: "Bengaluru"
  - keywords: "Software Engineer Java"
    location: "Bengaluru"

include_keywords:
  - java
  - spring boot
  - spring mvc
  - spring data jpa
  - hibernate
  - rest api
exclude_keywords:
  - senior
  - lead
  - manager
  - architect
  - director

max_jobs_per_run: 30
search_load_timeout_seconds: 60
search_load_retries: 2
post_apply_timeout_seconds: 30
headless: false
slow_mo_ms: 250
browser_channel: chrome

# These paths must stay unique for each person.
profile_dir: browser-profile-person2
history_file: applied_jobs.person2.json
answers_file: answers.person2.json

openai_model: gpt-4o-mini
resume_summary: >-
  Amisha Soni is a Software Engineer at Tata Consultancy Services (TCS), working
  for client AVIVA since October 2023 on backend services for life and annuity
  insurance products. Her professional stack includes Java, Spring Boot,
  Hibernate, Spring Data JPA, MySQL, and PostgreSQL. She develops RESTful APIs
  with exception handling, input validation, and DTO-based architecture. She
  improved premium-calculation performance by 10% through JPA query tuning, SQL
  optimization, and removing N+1 query issues, and reduced production issue
  resolution time by 20% through monitoring, logging, and root-cause analysis.
  She previously interned at Central Coalfields Limited from March 2022 to April
  2022, using HTML, CSS, JavaScript, and MySQL. She earned a B.Tech in Computer
  Science and Engineering from Ramgarh Engineering College in 2023 with a CGPA
  of 9.39/10. Her skills include Java, Python, Spring Boot, Spring MVC, Spring
  Data JPA, Hibernate, REST APIs, PostgreSQL, MySQL, Docker, Docker Compose,
  Maven, Git, GitHub, Postman, HTML, CSS, and JavaScript. Her e-commerce project
  used Java, Spring Boot 3.3.5, Spring Data JPA, Hibernate, PostgreSQL, REST APIs,
  Docker, and Docker Compose with Controller-Service-DTO-Repository architecture.
  She is based in Bangalore, Karnataka. Do not infer salary, notice period,
  availability, relocation preference, work authorization, or facts not stated
  here; ask the user when an application requires them.

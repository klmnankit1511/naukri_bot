    location: "Bengaluru"
  - keywords: "Java Developer Spring Boot Hibernate"
    location: "Bengaluru"
  - keywords: "Backend Developer Java REST API"
    location: "Bengaluru"
  - keywords: "Software Engineer Java Spring Boot"
    location: "Bengaluru"

include_keywords:
  - java
  - spring boot
  - spring
  - spring mvc
  - spring data jpa
  - hibernate
  - jpa
  - rest api
  - restful api
  - backend
  - backend developer
  - java developer
  - software engineer
  - microservices
  - postgresql
  - mysql
  - sql
  - docker
  - docker compose
  - maven

